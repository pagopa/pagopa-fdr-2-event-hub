microservice-chart: &microservice-chart
  namespace: "fdr"
  image:
    repository: ghcr.io/pagopa/pagopa-fdr-2-event-hub
    tag: "1.0.28-2-PIDM-2543-recovery-lost-events-API"
    pullPolicy: Always
  # https://github.com/Azure/azure-functions-host/blob/dev/src/WebJobs.Script.WebHost/Controllers/HostController.cs
  # livenessProbe:
  #   httpGet:
  #     path: /info
  #     port: 80
  #   initialDelaySeconds: 60
  #   failureThreshold: 6
  #   periodSeconds: 10
  # readinessProbe:
  #   httpGet:
  #     path: /info
  #     port: 80
  #   initialDelaySeconds: 60
  #   failureThreshold: 6
  #   periodSeconds: 10
  livenessProbe:
    handlerType: tcpSocket
    tcpSocket:
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 10
  readinessProbe:
    handlerType: tcpSocket
    tcpSocket:
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 10
  deployment:
    create: true
    replicas: 1 # (default) same as HPA minReplica
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
  serviceMonitor:
    create: true
    endpoints:
      - interval: 10s #jmx-exporter
        targetPort: 12345
        path: /metrics
  ports:
    - 12345 #jmx-exporter
    - 8080
  service:
    type: ClusterIP
    ports:
      - 8080
      - 12345 #jmx-exporter
  ingress: &ingress
    create: true
    host: "weudev.fdr.internal.dev.platform.pagopa.it"
    path: /pagopa-fdr-to-event-hub-service/(.*)
    servicePort: 8080
  serviceAccount:
    name: "fdr-workload-identity"
  azure:
    workloadIdentityClientId: <workload-identity-client-id-set-automatically-by-gha>
  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  resources: &resources
    requests:
      memory: "256Mi"
      cpu: "0.25"
    limits:
      memory: "768Mi"
      cpu: "0.40"
  autoscaling: &autoscaling
    enable: true
    minReplica: 1
    maxReplica: 1
    pollingInterval: 10 # seconds
    cooldownPeriod: 50 # seconds
    triggers:
      - type: cpu
        metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
        metadata:
          value: "75"
  envConfig: &envConfig
    APP_ENVIRONMENT: "dev"
    LOG_LEVEL: "ERROR"
    JAVA_OPTS: "-XX:+UseContainerSupport -XX:+UseG1GC -XX:MaxHeapSize=256m -XX:MinHeapSize=64m"
    WEBSITE_SITE_NAME: "pagopafdrtoeventhub" # required to show cloud role name in application insights
    FUNCTIONS_WORKER_RUNTIME: "java"
    BLOB_STORAGE_FDR1_CONTAINER: "fdr1-flows"
    BLOB_STORAGE_FDR3_CONTAINER: "fdr3-flows"
    BLOB_FILTER_PREFIX: "yyyy-MM-dd"
    EVENT_HUB_FLOWTX_NAME: "fdr-qi-flows"
    EVENT_HUB_REPORTEDIUV_NAME: "fdr-qi-reported-iuv"
    ASPNETCORE_URLS: "http://*:8080"
    FUNCTIONS_SECRETS_PATH: "/tmp/secrets"
    BLOB_FUNCTION_LOG_LEVEL: "INFO"
    RECOVERY_WORKER_ENABLED: "false"
    RECOVERY_WORKER_SCHEDULE: "0 * * * * *"
  envFieldRef: &envFieldRef
    APP_NAME: "metadata.labels['app.kubernetes.io/instance']"
    APP_VERSION: "metadata.labels['app.kubernetes.io/version']"
  envSecret: &envSecret
    APPLICATIONINSIGHTS_CONNECTION_STRING: "ai-connection-string"
    FDR_SA_CONNECTION_STRING: "fdr-sa-connection-string"
    EVENT_HUB_REPORTEDIUV_CONNECTION_STRING: "fdr-qi-reported-iuv-tx-connection-string"
    EVENT_HUB_FLOWTX_CONNECTION_STRING: "fdr-qi-flows-tx-connection-string"
    AzureWebJobsStorage: "fdr-sa-connection-string"
  keyvault: &keyvault
    name: "pagopa-d-fdr-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
  nodeSelector: {}
  tolerations:
    - key: dedicated
      operator: Equal
      value: "nodo"
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nodo
                operator: In
                values:
                  - "true"
  canaryDelivery:
    create: false
# Function for Fdr-To-EventHub for FdR1's BLOB trigger
fdr1-blobtrigger:
  !!merge <<: *microservice-chart
  ingress:
    !!merge <<: *ingress
    create: false
  resources:
    !!merge <<: *resources
  autoscaling:
    !!merge <<: *autoscaling
  envConfig:
    !!merge <<: *envConfig
    WEBSITE_SITE_NAME: 'pagopafdrtoeventhubfdr1blobtrigger'
    AzureFunctionsWebHost__hostid: "pagopafdr2eventhubfdr1"
    AzureFunctionsJobHost__functions__0: "Info"
    AzureFunctionsJobHost__functions__1: "ProcessFDR1BlobFiles"
    # AzureFunctionsJobHost__logging__logLevel__default: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Results: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Aggregator: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Function__ProcessFDR1BlobFiles: "Debug"
  envFieldRef:
    !!merge <<: *envFieldRef
  envSecret:
    !!merge <<: *envSecret
  keyvault:
    !!merge <<: *keyvault
# Function for Fdr-To-EventHub for FdR3's BLOB trigger
fdr3-blobtrigger:
  !!merge <<: *microservice-chart
  ingress:
    !!merge <<: *ingress
    create: false
  resources:
    !!merge <<: *resources
  autoscaling:
    !!merge <<: *autoscaling
  envConfig:
    !!merge <<: *envConfig
    WEBSITE_SITE_NAME: 'pagopafdrtoeventhubfdr3blobtrigger'
    AzureFunctionsWebHost__hostid: "pagopafdr2eventhubfdr3"
    AzureFunctionsJobHost__functions__0: "Info"
    AzureFunctionsJobHost__functions__1: "ProcessFDR3BlobFiles"
    # AzureFunctionsJobHost__logging__logLevel__default: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Results: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Aggregator: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Function__ProcessFDR3BlobFiles: "Debug"
  envFieldRef:
    !!merge <<: *envFieldRef
  envSecret:
    !!merge <<: *envSecret
  keyvault:
    !!merge <<: *keyvault
# Function for Fdr-To-EventHub for recovery HTTP trigger
recovery:
  !!merge <<: *microservice-chart
  ingress:
    !!merge <<: *ingress
    path: /pagopa-fdr-to-event-hub-recovery-service/(.*)
  resources:
    !!merge <<: *resources
    requests:
      memory: "128Mi"
      cpu: "0.2"
    limits:
      memory: "384Mi"
      cpu: "0.3"
  autoscaling:
    !!merge <<: *autoscaling
  envConfig:
    !!merge <<: *envConfig
    WEBSITE_SITE_NAME: 'pagopafdrtoeventhubrecovery'
    AzureFunctionsWebHost__hostid: "pagopafdr2eventhubrecovery"
    AzureFunctionsJobHost__functions__0: "Info"
    AzureFunctionsJobHost__functions__1: "HTTPBlobRecovery"
    AzureFunctionsJobHost__functions__2: "HTTPMassiveBlobRecovery"
    # AzureFunctionsJobHost__logging__logLevel__default: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Results: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Aggregator: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Function__HTTPBlobRecovery: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Function__HTTPMassiveBlobRecovery: "Debug"
  envFieldRef:
    !!merge <<: *envFieldRef
  envSecret:
    !!merge <<: *envSecret
  keyvault:
    !!merge <<: *keyvault
# Dedicated deployment for recovery job APIs and dry-run worker.
recovery-jobs:
  !!merge <<: *microservice-chart
  enabled: true
  deployment:
    create: true
    replicas: 1
  terminationGracePeriodSeconds: 120
  autoscaling:
    enable: false
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  serviceMonitor:
    create: false
  ports:
    - 8080
  service:
    type: ClusterIP
    ports:
      - 8080
  ingress:
    !!merge <<: *ingress
    path: /pagopa-fdr-to-event-hub-recovery-jobs-service/(.*)
  envConfig:
    !!merge <<: *envConfig
    WEBSITE_SITE_NAME: "pagopafdrtoeventhubrecoveryjobs"
    AzureFunctionsWebHost__hostid: "pagopafdr2eventhubrecoveryjobs"
    AzureFunctionsJobHost__functions__0: "Info"
    AzureFunctionsJobHost__functions__1: "RecoveryJobsCreate"
    AzureFunctionsJobHost__functions__2: "RecoveryJobsGet"
    AzureFunctionsJobHost__functions__3: "RecoveryJobsPause"
    AzureFunctionsJobHost__functions__4: "RecoveryJobsResume"
    AzureFunctionsJobHost__functions__5: "RecoveryDryRunWorker"
    AzureFunctionsJobHost__functions__6: "RecoveryJobsDiscoveryGet"
    AzureFunctionsJobHost__logging__logLevel__default: "Information"
    # Suppress SDK HTTP noise.
    # Function execution logs and Java application logs remain unchanged.
    AzureFunctionsJobHost__logging__logLevel__Azure.Core: "Error"
    AzureFunctionsJobHost__functionTimeout: "01:00:00"
    LOG_LEVEL: "INFO"
    JAVA_OPTS: "-XX:+UseContainerSupport -XX:+UseG1GC -Xms128m -Xmx512m"
    RECOVERY_JOBS_TABLE_NAME: "fdrrecoveryjobs"
    RECOVERY_ITEMS_TABLE_NAME: "fdrrecoveryitems"
    RECOVERY_DISCOVERY_PAGE_SIZE: "100"
    RECOVERY_JOB_PAGE_SIZE: "10"
    RECOVERY_POSTGRES_JDBC_URL: "jdbc:postgresql://fdr-db.d.internal.postgresql.pagopa.it:5432/fdr3"
    RECOVERY_POSTGRES_USERNAME: "fdr3"
    RECOVERY_POSTGRES_MAX_POOL_SIZE: "2"
    RECOVERY_POSTGRES_QUERY_TIMEOUT_SECONDS: "60"
    RECOVERY_ADX_CLUSTER_URL: "https://pagopaddataexplorer.westeurope.kusto.windows.net"
    RECOVERY_ADX_DATABASE: "re"
    RECOVERY_ADX_AUTH_MODE: "WORKLOAD_IDENTITY"
    RECOVERY_ADX_QUERY_TIMEOUT_SECONDS: "60"
  envFieldRef:
    !!merge <<: *envFieldRef
  envSecret:
    APPLICATIONINSIGHTS_CONNECTION_STRING: "ai-connection-string"
    FDR_SA_CONNECTION_STRING: "fdr-sa-connection-string"
    AzureWebJobsStorage: "fdr-sa-connection-string"
    RECOVERY_POSTGRES_PASSWORD: "db-fdr3-password"
  keyvault:
    !!merge <<: *keyvault
