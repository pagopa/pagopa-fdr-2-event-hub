microservice-chart: &microservice-chart
  namespace: "fdr"
  image:
    repository: ghcr.io/pagopa/pagopa-fdr-2-event-hub
    tag: "1.0.11-1-PAGOPA-2800-fd-r-sampling-dei-log-su-ai-e-elk"
    pullPolicy: Always
  # https://github.com/Azure/azure-functions-host/blob/dev/src/WebJobs.Script.WebHost/Controllers/HostController.cs
  # livenessProbe:
  #   httpGet:
  #     path: /info
  #     port: 80
  #   initialDelaySeconds: 60
  #   failureThreshold: 6
  #   periodSeconds: 10
  # readinessProbe:
  #   httpGet:
  #     path: /info
  #     port: 80
  #   initialDelaySeconds: 60
  #   failureThreshold: 6
  #   periodSeconds: 10
  livenessProbe:
    handlerType: tcpSocket
    tcpSocket:
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 10
  readinessProbe:
    handlerType: tcpSocket
    tcpSocket:
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 10
  deployment:
    create: true
  serviceMonitor:
    create: true
    endpoints:
      - interval: 10s #jmx-exporter
        targetPort: 12345
        path: /metrics
  ports:
    - 12345 #jmx-exporter
    - 8080
  service:
    type: ClusterIP
    ports:
      - 8080
      - 12345 #jmx-exporter
  ingress: &ingress
    create: true
    host: "weudev.fdr.internal.dev.platform.pagopa.it"
    path: /pagopa-fdr-to-event-hub-service/(.*)
    servicePort: 8080
  serviceAccount:
    name: "fdr-workload-identity"
  azure:
    workloadIdentityClientId: <workload-identity-client-id-set-automatically-by-gha>
  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  resources: &resources
    requests:
      memory: "256Mi"
      cpu: "0.25"
    limits:
      memory: "768Mi"
      cpu: "0.40"
  autoscaling: &autoscaling
    enable: true
    minReplica: 1
    maxReplica: 1
    pollingInterval: 10 # seconds
    cooldownPeriod: 50 # seconds
    triggers:
      - type: cpu
        metadata:
          # Required
          type: Utilization # Allowed types are 'Utilization' or 'AverageValue'
          value: "75"
  envConfig: &envConfig
    APP_ENVIRONMENT: "dev"
    JAVA_OPTS: "-XX:MaxHeapSize=256m -XX:MinHeapSize=64m"
    WEBSITE_SITE_NAME: "pagopafdrtoeventhub" # required to show cloud role name in application insights
    FUNCTIONS_WORKER_RUNTIME: "java"
    BLOB_STORAGE_FDR1_CONTAINER: "fdr1-flows"
    BLOB_STORAGE_FDR3_CONTAINER: "fdr3-flows"
    BLOB_FILTER_PREFIX: "yyyy-MM-dd"
    EVENT_HUB_FLOWTX_NAME: "fdr-qi-flows"
    EVENT_HUB_REPORTEDIUV_NAME: "fdr-qi-reported-iuv"
    ASPNETCORE_URLS: "http://*:8080"
    FUNCTIONS_SECRETS_PATH: "/tmp/secrets"
  envFieldRef: &envFieldRef
    APP_NAME: "metadata.labels['app.kubernetes.io/instance']"
    APP_VERSION: "metadata.labels['app.kubernetes.io/version']"
  envSecret: &envSecret
    APPLICATIONINSIGHTS_CONNECTION_STRING: "ai-connection-string"
    FDR_SA_CONNECTION_STRING: "fdr-sa-connection-string"
    EVENT_HUB_REPORTEDIUV_CONNECTION_STRING: "fdr-qi-reported-iuv-tx-connection-string"
    EVENT_HUB_FLOWTX_CONNECTION_STRING: "fdr-qi-flows-tx-connection-string"
    AzureWebJobsStorage: "fdr-sa-connection-string"
  keyvault: &keyvault
    name: "pagopa-d-fdr-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
  nodeSelector: {}
  tolerations:
    - key: dedicated
      operator: Equal
      value: "nodo"
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nodo
                operator: In
                values:
                  - "true"
  canaryDelivery:
    create: false
# Function for Fdr-To-EventHub for FdR1's BLOB trigger
fdr1-blobtrigger:
  !!merge <<: *microservice-chart
  ingress:
    !!merge <<: *ingress
    path: /fdr1-blobtrigger-notused/(.*)
  resources:
    !!merge <<: *resources
  autoscaling:
    !!merge <<: *autoscaling
  envConfig:
    !!merge <<: *envConfig
    WEBSITE_SITE_NAME: 'pagopafdrtoeventhubfdr1blobtrigger'
    AzureFunctionsWebHost__hostid: "pagopafdr2eventhubfdr1"
    AzureFunctionsJobHost__functions__0: "Info"
    AzureFunctionsJobHost__functions__1: "ProcessFDR1BlobFiles"
    # AzureFunctionsJobHost__logging__logLevel__default: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Results: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Aggregator: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Function__ProcessFDR1BlobFiles: "Debug"
  envFieldRef:
    !!merge <<: *envFieldRef
  envSecret:
    !!merge <<: *envSecret
  keyvault:
    !!merge <<: *keyvault
# Function for Fdr-To-EventHub for FdR3's BLOB trigger
fdr3-blobtrigger:
  !!merge <<: *microservice-chart
  ingress:
    !!merge <<: *ingress
    path: /fdr3-blobtrigger-notused/(.*)
  resources:
    !!merge <<: *resources
  autoscaling:
    !!merge <<: *autoscaling
  envConfig:
    !!merge <<: *envConfig
    WEBSITE_SITE_NAME: 'pagopafdrtoeventhubfdr3blobtrigger'
    AzureFunctionsWebHost__hostid: "pagopafdr2eventhubfdr3"
    AzureFunctionsJobHost__functions__0: "Info"
    AzureFunctionsJobHost__functions__1: "ProcessFDR3BlobFiles"
    # AzureFunctionsJobHost__logging__logLevel__default: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Results: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Aggregator: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Function__ProcessFDR3BlobFiles: "Debug"
  envFieldRef:
    !!merge <<: *envFieldRef
  envSecret:
    !!merge <<: *envSecret
  keyvault:
    !!merge <<: *keyvault
# Function for Fdr-To-EventHub for recovery HTTP trigger
recovery:
  !!merge <<: *microservice-chart
  ingress:
    !!merge <<: *ingress
    path: /pagopa-fdr-to-event-hub-recovery-service/(.*)
  resources:
    !!merge <<: *resources
    requests:
      memory: "128Mi"
      cpu: "0.2"
    limits:
      memory: "384Mi"
      cpu: "0.3"
  autoscaling:
    !!merge <<: *autoscaling
  envConfig:
    !!merge <<: *envConfig
    WEBSITE_SITE_NAME: 'pagopafdrtoeventhubrecovery'
    AzureFunctionsWebHost__hostid: "pagopafdr2eventhubrecovery"
    AzureFunctionsJobHost__functions__0: "Info"
    AzureFunctionsJobHost__functions__1: "HTTPBlobRecovery"
    AzureFunctionsJobHost__functions__2: "HTTPMassiveBlobRecovery"
    # AzureFunctionsJobHost__logging__logLevel__default: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Results: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Host__Aggregator: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Function__HTTPBlobRecovery: "Debug"
    # AzureFunctionsJobHost__logging__logLevel__Function__HTTPMassiveBlobRecovery: "Debug"
  envFieldRef:
    !!merge <<: *envFieldRef
  envSecret:
    !!merge <<: *envSecret
  keyvault:
    !!merge <<: *keyvault
